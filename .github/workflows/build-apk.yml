name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest já vem com o Android SDK instalado e as
      # licenças aceitas, então não precisamos de uma action separada
      # para isso — só garantir que os pacotes certos estão presentes.
      - name: Instalar plataforma/build-tools do Android
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      # Em vez de "upload-artifact" (que fica em blob storage só acessível
      # pelo navegador/gh CLI local), publicamos o APK direto numa branch
      # do próprio repositório Git, assim dá pra puxar com um git pull comum.
      - name: Publicar APK na branch "dist"
        run: |
          mkdir -p /tmp/dist-out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/dist-out/MeuIPTV-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan dist
          git rm -rf . > /dev/null
          cp /tmp/dist-out/MeuIPTV-debug.apk ./MeuIPTV-debug.apk
          echo "APK gerado automaticamente pelo GitHub Actions a partir do commit ${GITHUB_SHA}." > README.md
          git add MeuIPTV-debug.apk README.md
          git commit -m "build: MeuIPTV-debug.apk (commit ${GITHUB_SHA})"
          git push origin dist --force
